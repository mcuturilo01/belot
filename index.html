<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#356d97">
<title>Belot</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
 background:radial-gradient(ellipse at 50% 45%,#6aa3c8 0%,#4f88b0 45%,#356d97 100%);-webkit-user-select:none;user-select:none}
#app{height:100dvh;max-width:560px;margin:0 auto;position:relative;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.muted{opacity:.75}.small{font-size:13px}.warn{color:#ffd27a}
.redt{color:#e23b3b}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 16px;margin:8px 0;background:#24384a;font-weight:600;font-size:16px}
.btn.primary{background:#f5a623;color:#1d2a36}
.btn.ghost{background:rgba(255,255,255,.12)}
.btn.danger{background:#c0392b}
.btn.tiny{display:inline-block;width:auto;padding:7px 11px;font-size:13px;margin:4px 0;border-radius:9px}
.btn:disabled{opacity:.45}
.link{background:none;border:0;color:#fff;opacity:.8;text-decoration:underline;margin-top:10px;font-size:14px}

/* home + lobby */
.home,.lobby{padding:28px 22px;display:flex;flex-direction:column;align-items:stretch;min-height:100%;justify-content:center}
.logo{font-size:44px;font-weight:800;text-align:center;letter-spacing:1px}
.logo span{font-size:30px;margin:0 4px;opacity:.9}.logo .r{color:#ffb3b3}
.sub{text-align:center;margin:4px 0 24px;opacity:.85}
.lbl{font-size:13px;opacity:.8;margin-bottom:4px}
.home input{width:100%;border:0;border-radius:12px;padding:13px 14px;font-size:17px;background:#fff;color:#1d2a36}
.home .row{display:flex;gap:8px}.home .row input{flex:1;text-transform:uppercase;letter-spacing:3px}
.home .row .btn{width:auto;margin:0}
.or{text-align:center;margin:16px 0 8px;opacity:.75;font-size:14px}
.lhead{text-align:center;margin-bottom:12px}
.code{font-size:44px;font-weight:800;letter-spacing:8px}
.ltable{position:relative;height:330px;margin:10px 0 18px}
.lmid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;opacity:.7;width:90px;text-align:center}
.lseat{position:absolute;width:132px;min-height:92px;background:rgba(20,40,58,.72);border-radius:14px;padding:8px;text-align:center;border:2px solid transparent}
.lseat.mine{border-color:#f5a623}
.lseat.top{left:50%;top:0;transform:translateX(-50%)}.lseat.bottom{left:50%;bottom:0;transform:translateX(-50%)}
.lseat.left{left:0;top:50%;transform:translateY(-50%)}.lseat.right{right:0;top:50%;transform:translateY(-50%)}
.tlabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
.teamA .tlabel{color:#ffd27a}.teamB .tlabel{color:#a8e0ff}
.sname{font-weight:700;margin:4px 0;word-break:break-word}
.tag{font-size:10px;background:#f5a623;color:#1d2a36;border-radius:6px;padding:1px 5px;vertical-align:middle}
.on{color:#8ff0a4;font-size:12px}.off{color:#ffb3b3;font-size:12px}

/* game */
.game{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 8px 0}
.score{display:flex;gap:14px;background:#24384a;border:0;border-radius:12px;padding:6px 12px;border-bottom:4px solid #f5a623}
.score div{display:flex;flex-direction:column;align-items:center;min-width:34px}
.score small{font-size:11px;opacity:.85}.score b{font-size:22px}
.ctinfo{flex:1;text-align:center;line-height:1.2}
.ct{font-size:20px;font-weight:700}.ct small{font-size:12px;font-weight:500;opacity:.85}
.hang{color:#ffd27a}
.tbtns{display:flex;flex-direction:column;align-items:flex-end}
.tbtns .btn{margin:2px 0}
.felt{flex:1;position:relative;min-height:0}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:2;max-width:42%}
.seat.top{top:4px;left:50%;transform:translateX(-50%)}
.seat.left{left:4px;top:33%;transform:translateY(-50%)}
.seat.right{right:4px;top:33%;transform:translateY(-50%)}
.seat.bottom{bottom:2px;left:50%;transform:translateX(-50%);flex-direction:column-reverse}
.plate{display:flex;align-items:center;gap:6px;background:rgba(20,40,58,.85);border-radius:20px;padding:4px 10px 4px 4px;border:2px solid transparent;position:relative;max-width:100%}
.seat.turn .plate{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.35);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(245,166,35,.12)}}
.seat.offline .plate{opacity:.55}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:#f5a623;color:#1d2a36;flex:none}
.team1 .av{background:#7cc8f0}
.nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.nm small{font-weight:400;opacity:.8}
.dchip{position:absolute;right:-8px;top:-8px;background:#f5a623;color:#1d2a36;border-radius:50%;width:20px;height:20px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bid-chip{background:#fff;color:#1d2a36;border-radius:8px;padding:0 6px;font-weight:800;font-size:13px}
.bubble{background:#e6f6fb;color:#1d2a36;border-radius:12px;padding:5px 10px;margin:5px 0;font-weight:600;font-size:14px;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:4px}
.tags span{background:#ffe9b8;color:#3a2a00;border-radius:7px;padding:1px 6px;font-size:11px;font-weight:700}
.backs{display:flex;margin-bottom:4px;height:30px}
.backs i{width:20px;height:30px;border-radius:3px;margin-left:-12px;background:repeating-linear-gradient(45deg,#2c4a66 0 3px,#3a5f80 3px 6px);border:1.5px solid #dfe9f2}
.backs i:first-child{margin-left:0}
.seat.left .backs,.seat.right .backs{height:30px}

.card{position:relative;width:var(--cw,64px);height:calc(var(--cw,64px)*1.42);background:#fbfaf6;border-radius:7px;color:#1b1b1b;
 box-shadow:0 1px 4px rgba(0,0,0,.35);border:1px solid #c9c3b2;flex:none}
.card.red{color:#d42a2a}
.card .ix{position:absolute;left:4px;top:3px;display:flex;flex-direction:column;align-items:center;line-height:1}
.card .ix b{font-size:calc(var(--cw,64px)*.27);font-weight:700;letter-spacing:-1px}
.card .ix i{font-style:normal;font-size:calc(var(--cw,64px)*.24)}
.card .ix.bot{left:auto;top:auto;right:4px;bottom:3px;transform:rotate(180deg)}
.card .ctr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.card .pip{font-size:calc(var(--cw,64px)*.55)}
.card .fc{font-size:calc(var(--cw,64px)*.48);font-weight:800;font-family:Georgia,serif}
.card .fs{font-size:calc(var(--cw,64px)*.3)}
.trick{position:absolute;left:50%;top:46%;width:0;height:0;--cw:62px;z-index:1}
.trick .card{position:absolute;left:calc(var(--cw)*-.5);top:calc(var(--cw)*-.71)}
.trick .tb{transform:translate(0,56%) rotate(-3deg)}
.trick .tt{transform:translate(0,-56%) rotate(4deg)}
.trick .tl{transform:translate(-70%,8%) rotate(-8deg)}
.trick .tr{transform:translate(70%,8%) rotate(7deg)}
@keyframes pop{from{opacity:0;scale:.6}}
.trick .win{box-shadow:0 0 0 3px #f5a623,0 2px 10px rgba(0,0,0,.4);z-index:5}
.center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:4;width:92%;display:flex;justify-content:center}
.status{background:rgba(20,40,58,.8);padding:10px 16px;border-radius:12px;font-size:15px;text-align:center}
.log{position:absolute;left:50%;transform:translateX(-50%);top:21%;font-size:13px;background:rgba(0,0,0,.2);padding:3px 10px;border-radius:10px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;z-index:1}
.panel{background:#24384a;border:2px solid #f5a623;border-radius:14px;padding:10px;width:100%;max-width:360px;text-align:center}
.ptitle{font-weight:700;margin-bottom:8px}
.panel input[type=range]{width:100%}
.bidgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bidb{background:#e6f2f5;color:#1d2a36;border:0;border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-weight:600;font-size:13px;letter-spacing:.3px}
.bidb .bi{font-size:24px;font-weight:900;line-height:1.1}
.bidb.redj .bi,.bidb.x .bi{color:#e23b3b}
.bidb:disabled{background:#4a5d6c;color:#7f909c}
.bidb:disabled .bi{color:#7f909c}
.btn.pass{margin:8px 0 0;font-size:24px;padding:10px}
.abar{min-height:40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;padding:2px 8px}
.abar.dim{opacity:.8}
.hint{font-size:13px;opacity:.9}
.chip{border:0;border-radius:14px;padding:6px 10px;font-size:13px;font-weight:700;background:rgba(255,255,255,.18);color:#fff}
.chip.on{background:#f5a623;color:#1d2a36}
.chip.alt{background:#24384a}
.hand{position:relative;height:calc(var(--cw,70px)*1.42 + 40px);flex:none;overflow:visible}
.hand .card{position:absolute;transform-origin:50% 120%;transition:transform .12s;box-shadow:-2px 1px 5px rgba(0,0,0,.3)}
.hand .card.sel{transform:translateY(-22px)}
.hand .card.illegal{filter:brightness(.62) saturate(.6)}
.overlay{position:absolute;inset:0;background:rgba(10,24,36,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.sheet{background:#22364a;border:2px solid #f5a623;border-radius:16px;padding:14px;width:100%;max-height:92%;overflow:auto}
.shead{font-size:18px;font-weight:700;text-align:center;margin-bottom:8px}
.shead small{font-weight:400;opacity:.8;font-size:13px}
.sum{width:100%;border-collapse:collapse;font-size:14px}
.sum td{padding:6px 4px;border-bottom:1px solid rgba(245,166,35,.3);vertical-align:top}
.sum td:nth-child(n+2){text-align:center}
.sum .th td{color:#f5a623;font-weight:700;font-size:16px}
.sum .b td{font-weight:700}
.sum .tot td{background:#f5a623;color:#1d2a36;font-weight:800;font-size:17px}
.sum .res td:last-child{text-align:center;font-weight:700}
.strike{text-decoration:line-through;opacity:.55}
.rdy{color:#8ff0a4;margin-right:6px}
.gover{text-align:center;font-size:22px;font-weight:800;margin:12px 0 4px}
.gover.won{color:#8ff0a4}.gover.lost{color:#ffb3b3}
.lt{display:flex;justify-content:center;gap:6px;--cw:60px;text-align:center;margin:8px 0}
.lt .win{box-shadow:0 0 0 3px #f5a623}
.hist td{font-size:13px}
.rules ul{padding-left:18px;font-size:14px;line-height:1.45}
#netbar{display:none;position:fixed;top:env(safe-area-inset-top);left:0;right:0;background:#c0392b;color:#fff;text-align:center;padding:6px;font-size:13px;z-index:30}
#toast{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);background:#111c;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:86%;text-align:center}
#toast.on{opacity:1}
@media (min-height:760px){.trick{--cw:72px}}
.announce{position:absolute;left:50%;top:64%;transform:translateX(-50%);background:#ffe9b8;color:#3a2a00;font-weight:800;padding:8px 14px;border-radius:12px;z-index:25;box-shadow:0 2px 10px rgba(0,0,0,.3);animation:pop .2s ease-out;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.bhist{font-size:12px;margin-bottom:6px;opacity:.9}
.tag.bot{background:#7cc8f0}
.lseat .btn.tiny{display:block;margin:4px auto}

/* shot clock */
.clock{position:absolute;left:10px;right:30px;bottom:-10px;height:8px;background:rgba(0,0,0,.45);border-radius:3px;overflow:hidden}
.clock i{display:block;height:100%;background:#f5a623;animation-name:shrink;animation-timing-function:linear;animation-fill-mode:both}
.clock.urgent i{background:#ff4d3d}
@keyframes shrink{to{width:0}}
.seat .plate{margin-bottom:4px}
/* bids */
.btab{background:#f5a623;color:#1d2a36;font-weight:800;font-size:13px;letter-spacing:.5px;padding:2px 12px;border-radius:8px 8px 0 0;margin-bottom:-2px;white-space:nowrap}
.seat.bottom .btab{margin-bottom:0;margin-top:-2px;border-radius:0 0 8px 8px}
.bigbub{position:absolute;background:#e6f6fb;color:#1d2a36;font-weight:800;font-size:26px;padding:10px 18px;border-radius:16px;white-space:nowrap;z-index:6;
 box-shadow:0 4px 14px rgba(0,0,0,.3);animation:bub 1.7s ease-out both}
.bigbub.pass{color:#1d2a36}
.seat.top .bigbub{top:calc(100% + 6px)}
.seat.bottom .bigbub{bottom:calc(100% + 30px)}
.seat.left .bigbub{left:calc(100% + 8px);top:30%}
.seat.right .bigbub{right:calc(100% + 8px);top:30%}
@keyframes bub{0%{opacity:0;scale:.4}12%{opacity:1;scale:1.12}20%{scale:1}85%{opacity:1}100%{opacity:0}}
.trow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;margin:8px 0}
.hint.myturn{font-weight:700;color:#ffd27a}
/* trick: fly in from the player, then sweep to the winner */
.trick .inb{animation:inb .28s ease-out}.trick .int{animation:int .28s ease-out}.trick .inl{animation:inl .28s ease-out}.trick .inr{animation:inr .28s ease-out}
@keyframes inb{from{translate:0 220px;opacity:.4}}@keyframes int{from{translate:0 -200px;opacity:.4}}
@keyframes inl{from{translate:-180px 0;opacity:.4}}@keyframes inr{from{translate:180px 0;opacity:.4}}
.trick .colb{animation:colb .45s ease-in .85s forwards}.trick .colt{animation:colt .45s ease-in .85s forwards}
.trick .coll{animation:coll .45s ease-in .85s forwards}.trick .colr{animation:colr .45s ease-in .85s forwards}
@keyframes colb{to{translate:0 260px;opacity:0;scale:.5}}@keyframes colt{to{translate:0 -240px;opacity:0;scale:.5}}
@keyframes coll{to{translate:-200px 0;opacity:0;scale:.5}}@keyframes colr{to{translate:200px 0;opacity:0;scale:.5}}
/* cut + deal */
.fx{position:absolute;inset:0;z-index:7;pointer-events:none}
.fxdeck{position:absolute;left:50%;top:46%;width:58px;height:82px;margin:-41px 0 0 -29px}
.cutwait{position:relative;width:100%;height:150px}
.cutwait .fxdeck{top:40%}
.fxdeck i,.fly{position:absolute;width:58px;height:82px;border-radius:6px;border:2px solid #dfe9f2;
 background:repeating-linear-gradient(45deg,#2c4a66 0 4px,#3a5f80 4px 8px);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.fxdeck i{left:0;top:0}
.fxdeck i:nth-child(2){left:3px;top:-3px}
.fxdeck.cut i:nth-child(1){animation:cutA .8s ease-in-out both}
.fxdeck.cut i:nth-child(2){animation:cutB .8s ease-in-out both}
@keyframes cutA{40%{translate:-40px 0}100%{translate:0 0}}
@keyframes cutB{40%{translate:40px -6px;z-index:2}100%{translate:0 0}}
.fxtext{position:absolute;left:0;right:0;top:calc(46% - 82px);text-align:center;font-size:20px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.cutwait .fxtext{top:0}
.fxtext.big{font-size:24px;background:rgba(20,40,58,.8);width:max-content;max-width:92%;margin:0 auto;padding:6px 14px;border-radius:12px}
.fly{left:calc(50% - 29px);top:calc(46% - 41px);animation-name:fly;animation-timing-function:ease-out;animation-fill-mode:both;scale:.7}
.fly.tob{--tx:0px;--ty:330px}.fly.tot{--tx:0px;--ty:-240px}.fly.tol{--tx:-150px;--ty:-90px}.fly.tor{--tx:150px;--ty:-90px}
@keyframes fly{from{translate:0 0;opacity:1}90%{opacity:1}to{translate:var(--tx) var(--ty);opacity:0}}
.din{animation:din .26s ease-out both}
@keyframes din{from{opacity:0;translate:0 -50px;scale:.7}}

.cks{position:absolute;right:2px;bottom:-15px;background:#f5a623;color:#1d2a36;font-size:12px;font-weight:800;min-width:22px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cks.urgent{background:#ff4d3d;color:#fff;animation:pulse2 .5s infinite alternate}
@keyframes pulse2{to{scale:1.15}}
.seat .plate{margin-bottom:10px}
.center.low{top:auto;bottom:6px;transform:translateX(-50%)}
.center.low .panel{max-width:330px}

.pclock{position:relative;height:8px;background:rgba(0,0,0,.45);border-radius:4px;margin:4px 34px 10px 4px}
.pclock i{display:block;height:100%;border-radius:4px;background:#f5a623;animation-name:shrink;animation-timing-function:linear;animation-fill-mode:both}
.pclock.urgent i{background:#ff4d3d}
.pclock .cks{right:-32px;top:-5px;bottom:auto}

.announce{animation:pop .2s ease-out both}

/* quick chat */
.chatbtn{position:absolute;left:8px;bottom:calc(var(--cw,70px)*1.42 + 34px);width:44px;height:44px;border-radius:50%;border:0;background:#1f8fff;color:#fff;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:8}
.game{position:relative}
.sheet.chat{max-width:380px;padding:12px}
.rxgrid{display:grid;gap:8px}
.rxgrid.emo{grid-template-columns:repeat(4,1fr);margin-bottom:12px}
.rxgrid.txt{grid-template-columns:1fr 1fr}
.rx{border:0;border-radius:12px;background:#e6f2f5;color:#1d2a36;font-weight:700;font-size:14px;padding:10px 6px;min-height:44px}
.rx.emo{font-size:30px;padding:6px;background:rgba(255,255,255,.12)}
.rx:active{transform:scale(.94)}
.bigbub.react{font-size:17px;padding:8px 14px;width:max-content;max-width:200px;white-space:normal;text-align:center;line-height:1.2;animation:bubr 3s ease-out both}
.bigbub.react.emo{font-size:38px;padding:4px 10px;background:transparent;box-shadow:none}
@keyframes bubr{0%{opacity:0;scale:.4}8%{opacity:1;scale:1.12}14%{scale:1}88%{opacity:1}100%{opacity:0}}

/* score with the contract under it (belot.bg style) */
.scorecol{display:flex;flex-direction:column;width:150px}
.scorecol .score{border-bottom:0;border-radius:12px 12px 0 0;justify-content:center}
.ctbar{background:#f5a623;color:#1d2a36;border-radius:0 0 12px 12px;min-height:34px;display:flex;align-items:center;gap:6px;padding:3px 10px;font-size:12px;line-height:1.15}
.ctbar.empty{min-height:8px;padding:0}
.ctbar .cti{font-size:22px;font-weight:900;color:#1d2a36}
.ctbar .cti.redt{color:#c62828}
.ctbar .ctt{display:flex;flex-direction:column;min-width:0}
.ctbar .ctt b{font-size:13px}
.ctbar .ctt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.topbar{align-items:flex-start}
/* player tiles: big avatar with the name under it */
.seat{max-width:none}
.seat:not(.bottom) .plate{flex-direction:column;gap:3px;border-radius:14px;padding:6px 6px 5px;width:86px}
.seat:not(.bottom) .av{width:66px;height:66px;border-radius:12px;font-size:34px}
.seat:not(.bottom) .nm{font-size:13px;max-width:76px;text-align:center}
.seat:not(.bottom) .nm small{display:block}
.seat:not(.bottom) .bid-chip{position:absolute;left:-8px;top:-8px}
.seat.bottom .av{width:46px;height:46px;border-radius:10px;font-size:24px}
.seat.bottom .plate{border-radius:14px;padding:4px 14px 4px 4px;gap:10px}
.seat.bottom .nm{font-size:16px}
.seat.left,.seat.right{top:47%}
.seat.top .backs{position:absolute;left:calc(100% + 8px);top:30px}
.seat.top .tags{position:absolute;right:calc(100% + 8px);top:18px;flex-direction:column;align-items:flex-end;margin:0}
.seat.top .bigbub{top:calc(100% + 4px)}
/* tile size tuned so the side players stay visible next to the bid panel */
.seat:not(.bottom) .plate{width:80px}
.seat:not(.bottom) .av{width:60px;height:60px;font-size:32px}
.center.low .panel.bidpanel{max-width:232px;padding:8px}
.bidpanel .bidb{font-size:12px;padding:5px 2px}
.bidpanel .bidb .bi{font-size:22px}
.bidpanel .btn.pass{font-size:22px;padding:8px}
.bhist{font-size:11px}
@media (max-height:700px){
  .seat:not(.bottom) .plate{width:68px;padding:4px 4px 3px}
  .seat:not(.bottom) .av{width:46px;height:46px;font-size:26px;border-radius:10px}
  .seat:not(.bottom) .nm{font-size:12px;max-width:62px}
  .seat.bottom .av{width:38px;height:38px;font-size:20px}
  .seat.top .backs{top:18px}
  .trick{top:48%}
}
.announce{top:94px;right:8px;left:auto;transform:none;font-size:14px;padding:6px 12px;max-width:58%;white-space:normal;text-align:right}

/* characters */
.avrow{display:flex;justify-content:center;gap:8px;margin:6px 0 4px}
.avpick{width:54px;height:54px;padding:0;border:3px solid transparent;border-radius:50%;background:none}
.avpick svg{width:100%;height:100%;display:block}
.avpick.on{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.35)}
.avpick.taken{opacity:.3}
.av.pic{background:transparent;padding:0;overflow:hidden}
.av.pic svg{width:100%;height:100%;display:block}
.lav{width:46px;height:46px;margin:2px auto 0}
.lav svg{width:100%;height:100%;display:block}
.ltable{height:420px}
.lseat{width:124px}

/* 8 characters: two rows of four */
.avrow{display:grid;grid-template-columns:repeat(4,58px);justify-content:center;gap:8px 12px}
.avpick{width:58px;height:58px}
.avpick img,.av.pic img,.lav img{width:100%;height:100%;display:block;border-radius:50%;-webkit-user-drag:none}
.av.pic{border-radius:50% !important;background:transparent}
</style>

<script>/* Belot engine: Bulgarian rules (belot.bg standard).
   Pure logic, no DOM. Seats 0..3 in counter-clockwise play order. Teams: seat % 2. */
(function (root) {
  'use strict';

  const SUITS = ['C', 'D', 'H', 'S'];
  const RANKS = ['7', '8', '9', 'T', 'J', 'Q', 'K', 'A']; // natural order (sequences)
  const CONTRACTS = ['C', 'D', 'H', 'S', 'NT', 'AT'];       // bidding order, low -> high
  const TRUMP_ORDER = ['7', '8', 'Q', 'K', 'T', 'A', '9', 'J']; // low -> high
  const PLAIN_ORDER = ['7', '8', '9', 'J', 'Q', 'K', 'T', 'A']; // low -> high
  const TRUMP_PTS = { J: 20, '9': 14, A: 11, T: 10, K: 4, Q: 3, '8': 0, '7': 0 };
  const PLAIN_PTS = { A: 11, T: 10, K: 4, Q: 3, J: 2, '9': 0, '8': 0, '7': 0 };
  const CARRE_PTS = { J: 200, '9': 150, A: 100, T: 100, K: 100, Q: 100 };
  const CARRE_ORDER = ['Q', 'K', 'T', 'A', '9', 'J']; // low -> high (trump value)
  const SEQ_PTS = { 3: 20, 4: 50, 5: 100 };
  const SEQ_NAME = { 3: 'Tierce', 4: 'Quarte', 5: 'Quint' };
  const ROUND_LIMIT = { suit: 6, NT: 5, AT: 4 };
  const WIN_SCORE = 151;
  const BID_LABEL = { pass: 'Pass', C: 'Clubs', D: 'Diamonds', H: 'Hearts', S: 'Spades', NT: 'No Trumps', AT: 'All Trumps', double: 'Double', redouble: 'Redouble' };

  const suitOf = (c) => c[1];
  const rankOf = (c) => c[0];
  const teamOf = (s) => s % 2;
  const isSuitContract = (ct) => ct === 'C' || ct === 'D' || ct === 'H' || ct === 'S';

  function isTrump(card, ct) {
    if (ct === 'AT') return true;
    if (ct === 'NT') return false;
    return suitOf(card) === ct;
  }
  function strength(card, ct) {
    return isTrump(card, ct) ? 8 + TRUMP_ORDER.indexOf(rankOf(card)) : PLAIN_ORDER.indexOf(rankOf(card));
  }
  function cardPoints(card, ct) {
    return isTrump(card, ct) ? TRUMP_PTS[rankOf(card)] : PLAIN_PTS[rankOf(card)];
  }

  function newDeck() {
    const d = [];
    for (const s of SUITS) for (const r of RANKS) d.push(r + s);
    return d;
  }
  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {

      return higher.length ? higher : follow;

    const trumps = hand.filter((c) => suitOf(c) === ct);

    for (const o of opts) {

      if (!seen.has(k)) { seen.add(k); uniq.push(o); }

    if (a.top !== b.top) return a.top > b.top ? 1 : -1;

    const r = rankOf(card), s = suitOf(card);
    if (r !== 'K' && r !== 'Q') return false;
    const other = (r === 'K' ? 'Q' : 'K') + s;

    if (state.belotes.some((b) => b.seat === seat && b.suit === s)) return false;

    const f = (x, other) => {

  /* ---------- state machine ---------- */
  function newMatch(names, rnd) {
    rnd = rnd || Math.random;
    return {
      v: 1,
      phase: 'cut',
      names: names.slice(),
      scores: [0, 0],
      dealer: Math.floor(rnd() * 4),
      deck: shuffle(newDeck(), rnd),
      hands: [[], [], [], []],
      dealNo: 1,

      history: [],

  function dealCards(state, sizes) {
    let pos = state.deckPos || 0;
    for (const n of sizes) {
      for (let i = 1; i <= 4; i++) {
        const seat = (state.dealer + i) % 4;
        state.hands[seat].push(...state.deck.slice(pos, pos + n));

    state.deckPos = pos;
  }

  function startBidding(state) {
    state.phase = 'bid';
    state.hands = [[], [], [], []];
    state.deckPos = 0;
    dealCards(state, [3, 2]);
    state.bids = [];
    state.contract = null;
    state.passes = 0;
    state.turn = (state.dealer + 1) % 4;
    state.trick = [];
    state.lastTrick = null;
    state.tricks = [];
    state.declared = [[], [], [], []];
    state.declOpts = null;
    state.belotes = [];
    state.summary = null;

  function bidOptions(state, seat) {
    if (state.phase !== 'bid' || state.turn !== seat) return [];
    const opts = ['pass'];
    const cur = state.contract;
    const from = cur ? CONTRACTS.indexOf(cur.type) + 1 : 0;
    for (let i = from; i < CONTRACTS.length; i++) opts.push(CONTRACTS[i]);
    if (cur && cur.team !== teamOf(seat) && cur.mult === 1) opts.push('double');
    if (cur && cur.team === teamOf(seat) && cur.mult === 2) opts.push('redouble');
    return opts;
  }

  function startPlay(state) {
    dealCards(state, [3]);
    state.phase = 'play';
    state.turn = (state.dealer + 1) % 4;
    state.trick = [];
    state.trickNo = 0;
    const ct = state.contract.type;
    state.declOpts = [0, 1, 2, 3].map((s) => (ct === 'NT' ? [] : declOptions(state.hands[s])));
  }

  function collectRedeal(state) {
    // gather hands in dealing order (no shuffle), next dealer
    const order = [];
    for (let i = 1; i <= 4; i++) order.push(...state.hands[(state.dealer + i) % 4]);
    state.deck = order.concat(state.deck.slice(state.deckPos));
    state.hands = [[], [], [], []];
    state.dealer = (state.dealer + 1) % 4;
    state.phase = 'cut';
  }

  function log(state, msg) {
    state.log.push(msg);
    if (state.log.length > 30) state.log.shift();
  }

  /* apply an action from `seat` (or seat === -1 for host/system timers). Returns null or an error string. */
  function apply(state, seat, a) {
    const err = applyInner(state, seat, a);

  function applyInner(state, seat, a) {

        state.bids.push({ seat, bid: a.bid });

          state.passes = 0;
          if (a.bid === 'double') state.contract.mult = 2;
          else if (a.bid === 'redouble') state.contract.mult = 4;

        }

          log(state, 'All passed. Redeal.');
          state.phase = 'allpass';
          return null;
        }
        if (state.contract && state.passes === 3) {
          startPlay(state);
          return null;
        }
        state.turn = (state.turn + 1) % 4;
        return null;
      }
      case 'redeal': {
        if (state.phase !== 'allpass') return 'No redeal';
        collectRedeal(state);
        return null;
      }
      case 'play': {
        if (state.phase !== 'play') return 'Not playing now';
        if (seat !== state.turn) return 'Not your turn';
        const hand = state.hands[seat];
        const card = a.card;
        if (!hand.includes(card)) return 'You do not have that card';
        const ct = state.contract.type;
        if (!legalCards(hand, state.trick, ct, seat).includes(card)) return 'That card is not allowed';

        if (state.trickNo === 0 && a.decls && a.decls.length && ct !== 'NT') {
          const opt = state.declOpts[seat].find((o) => a.decls.every((k) => o.some((d) => d.key === k)));
          if (!opt) return 'Invalid declaration';
          state.declared[seat] = opt.filter((d) => a.decls.includes(d.key));
          for (const d of state.declared[seat]) log(state, `${state.names[seat]}: ${declName(d)}`);
        }
        if (a.belote && beloteEligible(state, seat, card)) {
          state.belotes.push({ seat, suit: suitOf(card) });

        state.trick.push({ seat, card });

        state.tricks.push({ cards: state.trick.map((p) => p.card), seats: state.trick.map((p) => p.seat), winner });

  function scoreDeal(state) {
    const ct = state.contract.type;
    const B = state.contract.team, O = 1 - B;
    const mult = state.contract.mult;

<script>/* Belot bot: rule-safe (only picks from legal moves) with simple, honest strategy.
   It only uses what a real player knows: its own hand, the bidding, and cards already played. */
(function (root) {

  function evalSuit(hand, s) {

      const r = rankOf(c);
      if (suitOf(c) === s) v += { J: 3, '9': has('J') ? 2.5 : 1.8, A: 1.2, T: 1, K: 0.6, Q: 0.6, '8': 0.5, '7': 0.5 }[r];

      else if (r === 'T') v += hand.includes('A' + suitOf(c)) ? 0.6 : 0.2;

  }

    let v = 0;

      else if (r === '9') v += hand.includes('J' + s) ? 1.8 : 0.9;
      else if (r === 'A') v += 0.6;
      else if (r === 'T') v += 0.3;

    return v;
  }

    let v = 0;

      const r = rankOf(c), s = suitOf(c);

      else if (r === 'T') v += hand.includes('A' + s) ? 1.3 : 0.5;
      else if (r === 'K') v += hand.includes('A' + s) && hand.includes('T' + s) ? 0.8 : 0.2;
    }
    return v;
  }

  function evalContract(hand, ct) { return ct === 'AT' ? evalAT(hand) : ct === 'NT' ? evalNT(hand) : evalSuit(hand, ct); }

  function bid(v) {
    const opts = v.bidOpts || ['pass'];

    let best = null, bestMargin = 0;

      if (!E.CONTRACTS.includes(o)) continue;

    const led = suitOf(trick[0].card);

    const winCard = trick[wi].card;

      return low(legal);
    }
    const winners = legal.filter((c) => beats(c, winCard, led, ct));
    if (winners.length) {
      if (last) return cheapest(winners);
      const sure = winners.filter((c) => isMaster(c) && (isTrump(c, ct) || !isSuitContract(ct) || suitOf(c) === led));
      if (sure.length) return sure.sort((a, b) => pts(b) - pts(a))[0];

      else if (g.phase === 'play' && g.trickNo === 0 && g.trick.length === 0) extra = PACE.deal3 * F;

      const later = (ms, fn) => { this.timer = setTimeout(() => { if (this.game === g && g.seq === seq) { fn(); this.changed(); } }, ms); };

        }

      if (g.phase === 'allpass') return later(2200 * F, () => E.apply(g, -1, { type: 'redeal' }));

        const waiting = [0, 1, 2, 3].filter((s) => !g.ready[s] && !off(s));

        const wait = away > 30000 ? 1100 : Math.min(8000, secs ? secs * 1000 : 8000);

      }

<script>/* Transports. Host-authoritative: clients send actions, host sends each client its own view.
   - p2p: PeerJS (WebRTC) for the standalone page
   - room: Claude artifact `room` capability (when the page runs as a claude.ai artifact) */
(function () {
  'use strict';
  const qs = new URLSearchParams(location.search);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const PREFIX = 'belotbg-v1-';

  function peerOpts() {
    const o = {
      debug: 0,
      config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }] },
    };
    if (qs.get('peerhost')) { // local signalling server (testing)
      o.host = qs.get('peerhost'); o.port = Number(qs.get('peerport') || 9000); o.path = '/'; o.secure = false;
      o.config = { iceServers: [] };
    }
    return o;
  }

  function p2p() {
    return {
      kind: 'p2p',
      host(code, h) {
        return new Promise((resolve, reject) => {
          const conns = new Map();
          let peer, done = false, attempts = 0;
          const api = {
            send(cid, msg) { const c = conns.get(cid); if (c && c.open) try { c.send(msg); } catch (e) { /* ignore */ } },
            close() { try { peer.destroy(); } catch (e) { /* ignore */ } },
          };
          const start = () => {
            attempts++;
            peer = new window.Peer(PREFIX + code.toLowerCase(), peerOpts());
            peer.on('open', () => { h.onStatus && h.onStatus('online'); if (!done) { done = true; resolve(api); } });
            peer.on('connection', (conn) => {
              const cid = conn.connectionId;
              conn.on('open', () => conns.set(cid, conn));
              conn.on('data', (d) => h.onMsg(cid, d));
              conn.on('close', () => { conns.delete(cid); h.onClose && h.onClose(cid); });
              conn.on('error', () => { conns.delete(cid); h.onClose && h.onClose(cid); });
            });
            peer.on('disconnected', () => {
              // only the matchmaking link dropped; players already at the table keep playing
              setTimeout(() => { if (!peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (e) { /* ignore */ } }, 1500);
            });
            peer.on('error', (err) => {
              if (err.type === 'unavailable-id') {
                // previous session of this table still registered: wait for it to expire
                try { peer.destroy(); } catch (e) { /* ignore */ }
                if (!done && attempts > 40) return reject(new Error('Table code is busy. Create a new table.'));
                h.onStatus && h.onStatus('claiming');
                setTimeout(start, 3000);
              } else if (err.type === 'browser-incompatible') {
                if (!done) { done = true; reject(new Error('This browser does not support peer-to-peer connections.')); }
              } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed') {
                if (!done) { try { peer.destroy(); } catch (e) { /* ignore */ } setTimeout(start, 3000); }
              }
            });
          };
          start();
        });
      },
      join(code, h) {
        let peer = null, conn = null, closed = false, retryT = null;
        const target = PREFIX + code.toLowerCase();
        const retry = (ms) => { clearTimeout(retryT); if (!closed) retryT = setTimeout(connect, ms); };
        const connect = () => {
          if (closed) return;
          if (!peer || peer.destroyed) return makePeer();
          if (peer.disconnected) { try { peer.reconnect(); } catch (e) { /* ignore */ } return retry(2500); }
          if (conn) try { conn.close(); } catch (e) { /* ignore */ }
          conn = peer.connect(target, { reliable: true, serialization: 'json' });
          const my = conn;
          const t = setTimeout(() => { if (!my.open && conn === my) retry(500); }, 20000);
          my.on('open', () => { clearTimeout(t); if (conn !== my) return; h.onStatus('connected'); h.onOpen(); });
          my.on('data', (d) => { if (conn === my) h.onMsg(d); });
          my.on('close', () => { if (conn === my && !closed) { h.onStatus('reconnecting'); retry(1500); } });
          my.on('error', () => { if (conn === my && !closed) { h.onStatus('reconnecting'); retry(2500); } });
        };
        const makePeer = () => {
          peer = new window.Peer(peerOpts());
          peer.on('open', connect);
          peer.on('disconnected', () => { if (!closed) setTimeout(() => { try { peer.reconnect(); } catch (e) { /* ignore */ } }, 1500); });
          peer.on('error', (err) => {
            if (closed) return;
            if (err.type === 'peer-unavailable') { h.onStatus('nohost'); retry(3000); }
            else if (err.type === 'browser-incompatible') h.onStatus('unsupported');
            else if (!(conn && conn.open)) { h.onStatus('reconnecting'); if (peer.destroyed) retry(3000); }
          });
        };
        makePeer();
        const wake = () => { if (!closed && document.visibilityState === 'visible' && !(conn && conn.open)) retry(50); };
        document.addEventListener('visibilitychange', wake);
        window.addEventListener('online', wake);
        return {
          send(msg) { if (conn && conn.open) try { conn.send(msg); } catch (e) { /* ignore */ } },
          kick() { if (!closed) retry(50); }, // silent link (e.g. after the phone slept): rebuild it
          close() { closed = true; clearTimeout(retryT); try { peer && peer.destroy(); } catch (e) { /* ignore */ } },
        };
      },
    };
  }

  /* claude.ai room: every message is broadcast; payloads are chunked to stay under the 4 KiB emit limit. */
  function roomT(room) {
    const CH = 1500;
    function sender(r, topic) {
      return (meta, msg) => {
        const s = JSON.stringify(msg);
        const id = Math.random().toString(36).slice(2, 10);
        const n = Math.ceil(s.length / CH) || 1;
        for (let i = 0; i < n; i++) r.emit(topic, Object.assign({ id, i, n, s: s.slice(i * CH, (i + 1) * CH) }, meta)).catch(() => {});
      };
    }
    function receiver(fn) {
      const parts = new Map();
      return (m) => {
        const d = m && m.data;
        if (!d || typeof d.s !== 'string') return;
        let p = parts.get(d.id);
        if (!p) { p = { n: d.n, got: 0, arr: [], t: Date.now() }; parts.set(d.id, p); }
        if (p.arr[d.i] === undefined) { p.arr[d.i] = d.s; p.got++; }
        if (p.got === p.n) {
          parts.delete(d.id);
          try { fn(d, JSON.parse(p.arr.join(''))); } catch (e) { /* ignore */ }
        }
        if (parts.size > 50) { const now = Date.now(); for (const [k, v] of parts) if (now - v.t > 10000) parts.delete(k); }
      };
    }
    return {
      kind: 'room',
      async host(code, h) {
        const r = await room.join('belot-' + code.toLowerCase());
        const send = sender(r, 'h2c');
        r.on('c2h', receiver((d, msg) => h.onMsg(d.from, msg)));
        r.onConnection && r.onConnection((c) => h.onStatus && h.onStatus(c ? 'online' : 'reconnecting'));
        return { send: (cid, msg) => send({ to: cid }, msg), close: () => r.leave().catch(() => {}) };
      },
      join(code, h) {
        let r = null, closed = false;
        const me = h.token;
        let send = null;
        (async () => {
          for (let i = 0; i < 20 && !closed; i++) {
            try { r = await room.join('belot-' + code.toLowerCase()); break; } catch (e) { await sleep(2000); }
          }
          if (!r) return h.onStatus('nohost');
          send = sender(r, 'c2h');
          r.on('h2c', receiver((d, msg) => { if (d.to === me) h.onMsg(msg); }));
          h.onStatus('connected');
          h.onOpen();
        })();
        return {
          send(msg) { if (send) send({ from: me }, msg); },
          close() { closed = true; if (r) r.leave().catch(() => {}); },
        };
      },
    };
  }

  /* game server (Cloudflare): one WebSocket per phone; the table lives on the server */
  function serverT(base) {
    base = base.replace(/\/+$/, '');
    return {
      kind: 'server',
      join(code, h) {
        let ws = null, closed = false, tries = 0, timer = null;
        const open = () => {
          if (closed) return;
          clearTimeout(timer);
          if (ws) { const old = ws; ws = null; try { old.close(); } catch (e) { /* ignore */ } }
          let my;
          try { my = new WebSocket(base + '/room/' + encodeURIComponent(code)); } catch (e) { return retry(); }
          ws = my;
          const t = setTimeout(() => { if (my.readyState !== 1) try { my.close(); } catch (e) { /* ignore */ } }, 10000);
          my.onopen = () => { clearTimeout(t); if (ws !== my) return; tries = 0; h.onStatus('connected'); h.onOpen(); };
          my.onmessage = (e) => { if (ws !== my) return; let m; try { m = JSON.parse(e.data); } catch (err) { return; } h.onMsg(m); };
          my.onclose = () => { clearTimeout(t); if (ws === my && !closed) { ws = null; h.onStatus('reconnecting'); retry(); } };
          my.onerror = () => { /* onclose follows */ };
        };
        const retry = () => { clearTimeout(timer); tries++; timer = setTimeout(open, Math.min(4000, 300 * tries)); };
        const wake = () => { if (!closed && document.visibilityState === 'visible' && (!ws || ws.readyState !== 1)) { tries = 0; open(); } };
        document.addEventListener('visibilitychange', wake);
        window.addEventListener('online', wake);
        open();
        return {
          send(m) { if (ws && ws.readyState === 1) try { ws.send(JSON.stringify(m)); } catch (e) { /* ignore */ } },
          kick() { if (!closed) { tries = 0; open(); } }, // replace a silent socket
          close() { closed = true; clearTimeout(timer); if (ws) try { ws.close(); } catch (e) { /* ignore */ } },
        };
      },
    };
  }

  async function pick() {
    const srv = qs.get('server') || window.BELOT_SERVER;
    if (srv && !window.claude && typeof WebSocket !== 'undefined') return serverT(srv);
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const room = await Promise.race([window.claude.use('room'), sleep(11000).then(() => null)]);
        if (room) return roomT(room);
      } catch (e) { /* fall through */ }
      return null; // inside claude.ai: peer-to-peer is blocked by the sandbox
    }
    if (window.Peer && window.RTCPeerConnection) return p2p();
    return null;
  }

  window.BelotNet = { pick };
})();

  const E = window.Belot;
  const qs = new URLSearchParams(location.search);
  const $ = (s) => document.querySelector(s);
  const store = {

    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
