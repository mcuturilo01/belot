  const cleanName = (s) => String(s || '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, 14) || 'Player';

  // timings (ms): cut + deal animations, trick collection
  const PACE = { cut: 800, step: 170, fly: 320, banner: 900, hold: 350, slide: 320, deal5: 2800, deal3: 2300, collect: 1500 };
  // quick chat options (index is what travels over the network)
  const REACTIONS = ['😂', '😘', '🤭', '😭', '🥺', '😡', '😈', '🤡',
    'nice job pal', 'good luck', 'thanks', 'too easy', 'hurry up 🐢', 'so lucky', 'just give up', 'im getting bored here'];
  const SYM = { C: '♣︎', D: '♦︎', H: '♥︎', S: '♠︎' };
  const RED = { D: 1, H: 1 };
  const RLAB = { T: '10' };
  const CT_LABEL = { C: 'Clubs', D: 'Diamonds', H: 'Hearts', S: 'Spades', NT: 'No Trumps', AT: 'All Trumps' };
  const CT_ICON = { C: SYM.C, D: SYM.D, H: SYM.H, S: SYM.S, NT: 'A', AT: 'J' };

  let me = store.get('belot-me');
  if (!me || !me.token) { me = { token: rid(20, 'abcdefghijkmnpqrstuvwxyz23456789'), name: '' }; store.set('belot-me', me); }

  /* =========================== HOST (table runs on this phone) =========================== */
  const Host = {
    table: null, net: null, tokCid: {}, cidTok: {},
    async start(code, saved, practice) {
      const kind = practice ? 'practice' : App.transport.kind;
      this.table = new window.BelotTable({
        code, owner: me.token, kind, practice, fast: qs.get('fast'), localToken: me.token,
        staleMs: kind === 'room' ? 15000 : 0,
        send: (tok, msg) => this.deliver(tok, msg),
        save: (d) => store.set('belot-host', Object.assign(d, { t: Date.now() })),
      });
      if (saved) this.table.load(saved);
      this.table.owner = me.token;
      this.table.hello(me.token, me.name, me.avatar);
      if (practice && !saved) { this.table.startPractice(me.token); this.table.changed(); }
      if (this.table.practice) return;
      this.net = await App.transport.host(code, {
        token: me.token,
        onMsg: (cid, m) => this.fromNet(cid, m),
        onClose: (cid) => { const t = this.cidTok[cid]; if (t && this.tokCid[t] === cid) { delete this.tokCid[t]; this.table.gone(t); } },
        onStatus: (s) => App.setNet(s === 'online' ? 'connected' : s),
      });
      setInterval(() => this.table.sweep(), 4000);
      this.table.changed();
    },
    fromNet(cid, m) {
      if (!m || typeof m !== 'object') return;
      if ((m.k === 'hello' || m.k === 'ping') && typeof m.token === 'string' && m.token !== me.token) {
        this.cidTok[cid] = m.token; this.tokCid[m.token] = cid;
        const p = this.table.players[m.token];
        if (m.k === 'hello' || !p || !p.online) return this.table.hello(m.token, m.name, m.avatar);
      }
      const tok = this.cidTok[cid];
      if (tok) this.table.handle(tok, m);
    },
    deliver(tok, msg) {
      if (tok === me.token) { const copy = JSON.parse(JSON.stringify(msg)); return queueMicrotask(() => Client.onMsg(copy)); } // copy: never share arrays with live state
      const cid = this.tokCid[tok];
      if (cid && this.net) this.net.send(cid, msg);
    },
    local(m) { this.table.handle(me.token, m); },
  };

  /* =========================== CLIENT =========================== */
  const Client = {
    net: null, lobby: null, view: null, seat: -1, pending: null, local: false, lastMsg: 0, create: false,
    connect(code, create) {
      this.code = code;
      this.create = !!create;
      this.net = App.transport.join(code, {
        token: me.token,
        onMsg: (m) => this.onMsg(m),
        onStatus: (s) => App.setNet(s),
        onOpen: () => { this.lastMsg = Date.now(); this.send({ k: 'hello', create: this.create }); },
      });
      setInterval(() => {
        this.send({ k: 'ping', seq: this.view ? this.view.seq : -1 });
        const quiet = Date.now() - this.lastMsg;
        // a socket that looks open but stays silent (common after the phone sleeps) gets replaced
        if (quiet > 9000 && this.net && this.net.kick) this.net.kick();
        if (quiet > 12000) App.setNet('waiting');
      }, 3000);
      setInterval(() => this.resend(), 2000);
    },
    send(m) {
      m = Object.assign({ token: me.token, name: me.name, avatar: me.avatar }, m);
      if (this.local) Host.local(m); else if (this.net) this.net.send(m);
    },
    act(a) {
      if (this.pending) return;
      const id = rid(8);
      this.pending = { id, a, seq: this.view ? this.view.seq : -1, t: Date.now() };
      this.send({ k: 'act', id, a });
      UI.render();
    },
    resend() {
      const p = this.pending;
      if (!p) return;
      if (Date.now() - p.t > 15000) { this.pending = null; UI.render(); return; }
      this.send({ k: 'act', id: p.id, a: p.a });
    },
    onMsg(m) {
      if (!m || typeof m !== 'object') return;
      this.lastMsg = Date.now();
      if (!this.local) App.setNet('connected');
      if (m.k === 'state') {
        const key = JSON.stringify(m.lobby) + '|' + (m.view ? m.view.seq : -1) + '|' + (m.you && m.you.seat);
        if (key === this.lastKey && !this.pending) return; // nothing new: avoid re-rendering under the user's finger
        this.lastKey = key;
        this.lobby = m.lobby;
        if (m.lobby && Number.isInteger(m.lobby.yourAvatar) && m.lobby.yourAvatar !== me.avatar) { me.avatar = m.lobby.yourAvatar; store.set('belot-me', me); }
        this.seat = m.you ? m.you.seat : -1;
        const prev = this.view;
        this.view = m.view;
        const ck = m.view && m.view.clock;
        const ckey = m.view ? m.view.seq : -1;
        if (ckey !== this.clockKey || (ck && !this.clock)) {
          this.clockKey = ckey;
          const now = Date.now();
          this.clock = ck ? { seat: ck.seat, start: now + ck.delay, end: now + ck.delay + ck.left, limit: ck.limit } : null;
        }
        if (this.pending && (!m.view || m.view.seq !== this.pending.seq)) this.pending = null;
        if (!this.local && m.lobby) { store.set('belot-client', { code: m.lobby.code, t: Date.now() }); this.create = false; }
        UI.onState(prev, this.view);
      } else if (m.k === 'react') {
        UI.showReact(m.seat, m.i);
      } else if (m.k === 'err') {
        if (m.fatal) { store.del('belot-client'); if (this.net) this.net.close(); UI.toast(m.err); setTimeout(() => App.leave(), 1800); return; }
        if (this.pending && this.pending.id === m.id) this.pending = null;
        UI.toast(m.err);
        UI.render();
      }
    },
  };

  /* =========================== APP =========================== */
  const App = {
    transport: null, netState: 'idle',
    // connection banner: 'connected' shows at once, problems only after 2.5 s (no flashing on short hiccups)
    setNet(s) {
      this.rawNet = s;
      clearTimeout(this.netT);
      const show = () => { if (this.netState !== s) { this.netState = s; UI.renderBanner(); } };
      if (s === 'connected' || s === 'idle' || s === 'connecting') return show();
      this.netT = setTimeout(() => { if (this.rawNet === s) show(); }, 2500);
    },
    async boot() {
      UI.init();
      UI.render();
      this.transport = await window.BelotNet.pick();
      this.picked = true;
      UI.render();
      const hp = store.get('belot-host');
      if (hp && !hp.owner && hp.players) hp.owner = me.token; // saved by an older version
      if (hp && hp.practice && Date.now() - hp.t < 8 * 3600e3 && me.name && !(location.hash || '').replace('#', '')) return this.createTable(hp);
      if (!this.transport) return;
      // auto-resume
      const hashCode = (location.hash || '').replace('#', '').toUpperCase();
      const h = store.get('belot-host');
      const c = store.get('belot-client');
      const fresh = (x) => x && Date.now() - x.t < 8 * 3600e3;
      if (this.transport.kind !== 'server' && fresh(h) && !h.practice && (!hashCode || hashCode === h.code) && me.name) return this.createTable(h);
      if (hashCode && /^[A-Z0-9]{4,8}$/.test(hashCode) && me.name) {
        if (fresh(c) && c.code === hashCode) return this.joinTable(hashCode);
        UI.joinCode = hashCode;
      }
      UI.render();
    },
    async createTable(saved, practice) {
      practice = practice || !!(saved && saved.practice);
      if (!this.transport && !practice) return;
      if (!practice && this.transport.kind === 'server') {
        // the table lives on the game server: just open a new code there
        const code = rid(5);
        UI.screen = 'connecting';
        this.setNet('connecting');
        try { history.replaceState(null, '', '#' + code); } catch (e) { /* ignore */ }
        Client.connect(code, true);
        UI.keepAwake();
        return UI.render();
      }
      Client.local = true;
      const code = saved ? saved.code : rid(5);
      UI.screen = 'connecting';
      UI.render();
      try {
        await Host.start(code, saved, practice);
        this.setNet('connected');
        if (!practice) try { history.replaceState(null, '', '#' + code); } catch (e) { /* ignore */ }
        UI.keepAwake();
      } catch (e) {
        UI.screen = 'home'; Client.local = false; store.del('belot-host');
        UI.toast(e.message || 'Could not create table');
      }
      UI.render();
    },
    joinTable(code) {
      if (!this.transport) return;
      code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length < 4) return UI.toast('Enter the table code');
      UI.screen = 'connecting';
      this.setNet('connecting');
      try { history.replaceState(null, '', '#' + code); } catch (e) { /* ignore */ }
      Client.connect(code);
      UI.keepAwake();
      UI.render();
    },
    leave() {
      if (Client.local) store.del('belot-host'); else store.del('belot-client');
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
      location.reload();
    },
  };

  /* =========================== UI =========================== */
  const UI = {
    screen: 'home', joinCode: '', sel: null, declIdx: 0, declOff: {}, beloteOn: true, overlay: null, toastT: null,
    animKeys: new Set(),
    init() {
      // tick the shot-clock seconds without re-rendering the table
      setInterval(() => {
        const now = Date.now();
        document.querySelectorAll('.cks').forEach((el) => {
          const t = Math.max(0, Math.ceil((Number(el.dataset.end) - now) / 1000));
          const ck = Client.clock;
          const shown = ck && now < ck.start ? Math.round(ck.limit / 1000) : t;
          if (el.textContent !== String(shown)) el.textContent = shown;
        });
      }, 250);
      document.addEventListener('click', (e) => this.onClick(e));
      document.addEventListener('input', (e) => {
        if (e.target.id === 'name') { me.name = e.target.value; store.set('belot-me', me); }
        if (e.target.id === 'code') this.joinCode = e.target.value.toUpperCase();
        if (e.target.id === 'cutr') { const o = $('#cutv'); if (o) o.textContent = e.target.value; }
      });
      window.addEventListener('resize', () => this.render());
    },
    keepAwake() {
      const req = async () => { try { if (navigator.wakeLock) this.wl = await navigator.wakeLock.request('screen'); } catch (e) { /* ignore */ } };
      req();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') req(); });
    },
    toast(msg) {
      const t = $('#toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('on');
      clearTimeout(this.toastT);
      this.toastT = setTimeout(() => t.classList.remove('on'), 2600);
    },
    onState(prev, v) {
      if (v && prev && v.log.length && JSON.stringify(v.log) !== JSON.stringify(prev.log)) {
        const fresh = v.log.filter((x) => !prev.log.includes(x));
        const hit = fresh.filter((x) => /Belote|Tierce|Quarte|Quint|Carré|Redeal|Double|Redouble/.test(x));
        if (hit.length) { this.announce = { text: hit.join(' · '), t0: Date.now(), until: Date.now() + 2600 }; setTimeout(() => this.render(), 2700); }
      }
      if (v && prev && v.dealNo !== prev.dealNo) { this.overlay = null; }
      const now = Date.now();
      if (v && prev) {
        if (v.phase === 'bid' && v.bids.length === 0 && (prev.phase !== 'bid' || prev.dealNo !== v.dealNo)) {
          this.fx = { kind: 5, t0: now, pre: PACE.cut, dealer: v.dealer, cutter: v.cutter };
        } else if (v.phase === 'play' && prev.phase === 'bid') {
          this.fx = { kind: 3, t0: now, pre: PACE.banner, dealer: v.dealer, contract: v.contract };
        }
        if (this.fx && this.fx.t0 === now) {
          this.fx.dur = this.fx.pre + ((this.fx.kind === 5 ? 8 : 4) - 1) * PACE.step + PACE.fly + 60;
          setTimeout(() => this.render(), this.fx.dur + 20);
          setTimeout(() => this.render(), this.fx.dur + PACE.hold + 20);
          setTimeout(() => this.render(), this.fx.pre + 10);
          for (let j = 0; j < (this.fx.kind === 5 ? 8 : 4); j++) setTimeout(() => this.render(), this.fx.pre + j * PACE.step + PACE.fly + 5);
        }
        if (v.dealNo === prev.dealNo && v.bids.length > prev.bids.length) {
          const b = v.bids[v.bids.length - 1];
          this.pop = { seat: b.seat, bid: b.bid, t0: now, until: now + 1700 };
          setTimeout(() => this.render(), 1750);
        }
        if (v.phase === 'dealEnd' && prev.phase !== 'dealEnd') { this.sumAt = now + 900; setTimeout(() => this.render(), 950); }
        if (v.phase === 'trickDone' && prev.phase !== 'trickDone') this.tdAt = now;
      }
      if (v && (!prev || prev.turn !== v.turn || prev.phase !== v.phase)) {
        this.sel = null; this.declIdx = 0; this.declOff = {}; this.beloteOn = true;
        if (v.turn === Client.seat && v.phase !== (prev && prev.phase) && navigator.vibrate) try { navigator.vibrate(40); } catch (e) { /* ignore */ }
        else if (v.turn === Client.seat && navigator.vibrate) try { navigator.vibrate(40); } catch (e) { /* ignore */ }
      }
      this.render();
    },
    host() { return !!(Client.lobby && Client.lobby.youHost); },
    avatarRow(taken) {
      const AV = window.BelotAvatars || [];
      return `<div class="avrow">${AV.map((svg, i) => {
        const t = (taken || []).includes(i);
        return `<button class="avpick ${me.avatar === i ? 'on' : ''} ${t ? 'taken' : ''}" data-a="avatar" data-i="${i}" ${t ? 'disabled' : ''} aria-label="Character ${i + 1}">${svg}</button>`;
      }).join('')}</div>`;
    },
    avatarOf(seatInfo, name) {
      const AV = window.BelotAvatars || [];
      if (seatInfo && seatInfo.bot) return '<div class="av">🤖</div>';
      if (seatInfo && Number.isInteger(seatInfo.avatar) && AV[seatInfo.avatar]) return `<div class="av pic">${AV[seatInfo.avatar]}</div>`;
      return `<div class="av">${esc(String(name || '?').slice(0, 1).toUpperCase())}</div>`;
    },
    showReact(seat, i) {
      if (!(seat >= 0 && seat < 4) || !REACTIONS[i]) return;
      const now = Date.now();
      this.reacts = this.reacts || {};
      this.reacts[seat] = { i, t0: now, until: now + 3000 };
      clearTimeout(this.reactT);
      this.reactT = setTimeout(() => this.render(), 3050);
      this.render();
    },
    chatHTML() {
      const b = (i) => `<button class="rx ${i < 8 ? 'emo' : ''}" data-a="react" data-i="${i}">${esc(REACTIONS[i])}</button>`;
      const emo = [0, 1, 2, 3, 4, 5, 6, 7].map(b).join('');
      const txt = [8, 9, 10, 11, 12, 13, 14, 15].map(b).join('');
      return `<div class="overlay" data-a="close"><div class="sheet chat"><div class="rxgrid emo">${emo}</div><div class="rxgrid txt">${txt}</div></div></div>`;
    },
    rel(seat) { const my = Client.seat >= 0 ? Client.seat : 0; return (seat - my + 4) % 4; },
    myTeam() { return (Client.seat >= 0 ? Client.seat : 0) % 2; },

    /* ---------- cards ---------- */
    card(c, cls = '', attrs = '') {
      const r = c[0], s = c[1];
      const face = r === 'J' || r === 'Q' || r === 'K';
      const center = face ? `<span class="fc">${r}</span><span class="fs">${SYM[s]}</span>` : `<span class="pip">${SYM[s]}</span>`;
      return `<div class="card ${RED[s] ? 'red' : ''} ${cls}" data-card="${c}" ${attrs}><div class="ix"><b>${RLAB[r] || r}</b><i>${SYM[s]}</i></div><div class="ctr">${center}</div><div class="ix bot"><b>${RLAB[r] || r}</b><i>${SYM[s]}</i></div></div>`;
    },
    sortHand(hand, ct) {
      const present = E.SUITS.filter((s) => hand.some((c) => c[1] === s));
      // alternate colours where possible: black, red, black, red
      const blacks = present.filter((s) => !RED[s]), reds = present.filter((s) => RED[s]);
      const order = [];
      while (blacks.length || reds.length) { if (blacks.length) order.push(blacks.shift()); if (reds.length) order.push(reds.shift()); }
      const key = (c) => (ct ? E.strength(c, ct) : E.RANKS.indexOf(c[0]));
      return hand.slice().sort((a, b) => order.indexOf(a[1]) - order.indexOf(b[1]) || key(a) - key(b));
    },
    whyIllegal(c, v) {
      const ct = v.contract.type, t = v.trick;
      if (!t.length) return 'Not allowed';
      const led = t[0].card[1];
      const hand = v.hand;
      if (hand.some((x) => x[1] === led) && c[1] !== led) return `You must follow ${SYM[led]}`;
      if (c[1] === led) return `You must play higher than the ${this.cardName(t[E.trickWinnerIndex(t, ct)].card)}`;
      const wi = E.trickWinnerIndex(t, ct);
      if (E.isTrump(t[wi].card, ct)) return `You must overtrump with a higher ${SYM[ct]}`;
      return `You must trump (${SYM[ct]})`;
    },
    cardName(c) { return (RLAB[c[0]] || c[0]) + SYM[c[1]]; },

    /* ---------- render ---------- */
    render() {
      const root = $('#app');
      if (!root) return;
      const v = Client.view, L = Client.lobby;
      let html;
      if (!App.transport && App.netState === 'idle' && this.screen === 'home' && !this.booted) { this.booted = true; }
      if (L && L.started && v) html = this.gameHTML(v);
      else if (L) html = this.lobbyHTML(L);
      else if (this.screen === 'connecting') html = this.connectingHTML();
      else html = this.homeHTML();
      const prevPos = this.handPos || {};
      const an = this.announce && Date.now() < this.announce.until ? `<div class="announce" style="animation-delay:${this.announce.t0 - Date.now()}ms">${esc(this.announce.text)}</div>` : '';
      root.innerHTML = html + an;
      this.renderBanner();
      this.animateHand(prevPos);
      // re-render when the shot clock starts and when it enters its last 5 seconds
      clearTimeout(this.ckT);
      const ck = Client.clock;
      if (ck && v) {
        const now = Date.now();
        const marks = [ck.start, ck.end - 5000].filter((t) => t > now + 20);
        if (marks.length) {
          this.ckT = setTimeout(() => {
            if (ck.seat === Client.seat && Date.now() >= ck.end - 5100 && navigator.vibrate) try { navigator.vibrate([30, 60, 30]); } catch (e) { /* ignore */ }
            this.render();
          }, Math.min(...marks) - now + 30);
        }
      }
    },
    renderBanner() {
      const el = $('#netbar');
      if (!el) return;
      const msg = (Client.lobby || this.screen === 'connecting') ? this.bannerText() : '';
      el.textContent = msg || '';
      el.style.display = msg ? 'block' : 'none';
    },
    bannerText() {
      const s = App.netState;
      return Client.local
        ? { reconnecting: 'Reconnecting to the network…', offline: 'Offline. Retrying…', claiming: 'Reopening your table…' }[s]
        : { connecting: 'Connecting to the table…', reconnecting: 'Reconnecting…', nohost: App.transport && App.transport.kind === 'server' ? 'Game server not reachable. Retrying…' : 'Host not reachable. Is the host app open?', waiting: App.transport && App.transport.kind === 'server' ? 'Reconnecting…' : 'Waiting for the host…', unsupported: 'This browser cannot connect' }[s];
    },
    homeHTML() {
      const t = App.transport;
      const h = store.get('belot-host');
      const note = !t
        ? (App.picked ? (window.claude ? '<p class="warn">Live play is not available in this view. Ask the owner to share this page with you as a Contributor, then reopen it.</p>' : '<p class="warn">This browser cannot run peer-to-peer games.</p>') : '<p class="muted">Preparing connection…</p>')
        : `<p class="muted small">${t.kind === 'room' ? 'Connection: Claude live room. Everyone needs access to this page.' : 'Connection: direct (peer-to-peer). Keep the app open while playing.'}</p>`;
      return `<div class="home">
        <div class="logo"><span>${SYM.S}</span><span class="r">${SYM.H}</span>Belot<span>${SYM.C}</span><span class="r">${SYM.D}</span></div>
        <p class="sub">Bulgarian rules · 4 players</p>
        <label class="lbl">Your name</label>
        <input id="name" maxlength="14" autocomplete="off" placeholder="Name" value="${esc(me.name)}">
        <label class="lbl" style="margin-top:12px">Your character</label>
        ${this.avatarRow([])}
        <button class="btn primary" data-a="create" ${t ? '' : 'disabled'}>Create table</button>
        <button class="btn ghost" data-a="practice">Practice vs 3 bots</button>
        <div class="or">or join a table</div>
        <div class="row"><input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="CODE" value="${esc(this.joinCode)}"><button class="btn" data-a="join" ${t ? '' : 'disabled'}>Join</button></div>
        ${h && h.code ? `<button class="btn ghost" data-a="resume">${h.practice ? 'Resume practice game' : 'Resume table ' + esc(h.code)}</button>` : ''}
        ${note}
        <button class="link" data-a="rules">Rules used</button>
      </div>${this.overlay === 'rules' ? this.rulesHTML() : ''}`;
    },
    connectingHTML() {
      return `<div class="home"><div class="logo">Belot</div><p class="muted">Connecting…</p><button class="btn ghost" data-a="leave">Cancel</button></div>`;
    },
    lobbyHTML(L) {
      const link = L.kind === 'p2p' && location.protocol.startsWith('http') ? location.href.split('#')[0] + '#' + L.code : '';
      const mySeat = Client.seat;
      const seat = (s, pos) => {
        const p = L.seats[s];
        const team = s % 2 === 0 ? 'A' : 'B';
        let inner;
        if (p && p.bot) inner = `<div class="sname">${esc(p.name)} <span class="tag bot">bot</span></div>${this.host() ? `<button class="btn tiny ghost" data-a="rmbot" data-s="${s}">Remove</button>` : '<div class="on">ready</div>'}`;
        else if (p) inner = `${Number.isInteger(p.avatar) && window.BelotAvatars ? `<div class="lav">${window.BelotAvatars[p.avatar]}</div>` : ''}<div class="sname">${esc(p.name)}${p.host ? ' <span class="tag">host</span>' : ''}</div><div class="${p.online ? 'on' : 'off'}">${p.online ? 'ready' : 'offline'}</div>${s === mySeat ? '<button class="btn tiny ghost" data-a="sit" data-s="-1">Stand up</button>' : ''}`;
        else inner = `<button class="btn tiny" data-a="sit" data-s="${s}">Sit here</button>${this.host() ? `<button class="btn tiny ghost" data-a="addbot" data-s="${s}">Add bot</button>` : ''}`;
        return `<div class="lseat ${pos} team${team} ${s === mySeat ? 'mine' : ''}"><div class="tlabel">Team ${team}</div>${inner}</div>`;
      };
      const all = L.seats.every(Boolean);
      return `<div class="lobby">
        <div class="lhead"><div class="muted small">Table code</div><div class="code">${esc(L.code)}</div>
          ${link ? `<button class="btn tiny" data-a="copy" data-t="${esc(link)}">Copy invite link</button>` : '<div class="small muted">Friends open this same page and join with the code</div>'}</div>
        <div class="ltable">${seat(2, 'top')}${seat(3, 'left')}${seat(1, 'right')}${seat(0, 'bottom')}<div class="lmid">Partners sit opposite</div></div>
        ${L.watchers.length ? `<p class="muted small">Not seated: ${L.watchers.map(esc).join(', ')}</p>` : ''}
        <div class="small muted" style="text-align:center;margin-top:4px">Your character</div>
        ${this.avatarRow(L.taken)}
        ${this.timerRow(L.turnSecs)}
        ${this.host() && !all ? '<button class="btn ghost" data-a="fillbots">Fill empty seats with bots</button>' : ''}
        ${this.host() ? `<button class="btn primary" data-a="start" ${all ? '' : 'disabled'}>${all ? 'Start game' : 'Waiting for 4 players'}</button>` : `<p class="muted">${all ? 'Waiting for the host to start' : 'Waiting for 4 players'}</p>`}
        <button class="link" data-a="leave">Leave table</button>
      </div>`;
    },
    seatHTML(v, seat) {
      const pos = ['bottom', 'right', 'top', 'left'][this.rel(seat)];
      const L = Client.lobby;
      const online = L.seats[seat] ? L.seats[seat].online : false;
      const name = v.names[seat];
      const isTurn = v.turn === seat && !this.dealing();
      const now = Date.now();
      // bidding: persistent orange tab with the player's latest bid + big pop-up bubble when it happens
      let tab = '', big = '';
      if (v.phase === 'bid' || v.phase === 'allpass' || (this.dealing() && this.fx.kind === 3)) {
        const mine = v.bids.filter((b) => b.seat === seat);
        if (mine.length) tab = `<div class="btab ${mine[mine.length - 1].bid === 'pass' ? 'pass' : ''}">${this.bidShort(mine[mine.length - 1].bid)}</div>`;
      }
      const rx = this.reacts && this.reacts[seat];
      if (rx && now < rx.until) big = `<div class="bigbub react ${rx.i < 8 ? 'emo' : ''}" style="animation-delay:${rx.t0 - now}ms">${esc(REACTIONS[rx.i])}</div>`;
      else if (this.pop && this.pop.seat === seat && now < this.pop.until) big = `<div class="bigbub ${this.pop.bid === 'pass' ? 'pass' : ''}" style="animation-delay:${this.pop.t0 - now}ms">${this.bidShort(this.pop.bid)}</div>`;
      const tags = [];
      if (v.phase === 'play' || v.phase === 'trickDone' || v.phase === 'dealEnd') {
        for (const d of v.announced[seat] || []) tags.push(this.declShort(d, v.trickNo >= 1 || seat === Client.seat));
        for (const b of v.belotes) if (b.seat === seat) tags.push('Belote' + (v.contract.type === 'AT' ? ' ' + SYM[b.suit] : ''));
      }
      const bidder = v.contract && v.contract.bidder === seat && v.phase !== 'bid' ? '<span class="bid-chip">' + this.ctChip(v.contract) + '</span>' : '';
      // shot clock
      let clock = '';
      const ck = Client.clock;
      if (ck && ck.seat === seat && v.phase !== 'trickDone') {
        const left = Math.max(0, ck.end - Math.max(now, ck.start));
        const delay = Math.max(0, ck.start - now);
        clock = `<div class="clock ${left < 5000 && now >= ck.start ? 'urgent' : ''}"><i style="width:${(left / ck.limit) * 100}%;animation-duration:${left}ms;animation-delay:${delay}ms"></i></div><b class="cks ${left < 5000 && now >= ck.start ? 'urgent' : ''}" style="animation-delay:${-(now % 1000)}ms" data-end="${ck.end}">${Math.ceil(Math.min(left, ck.limit) / 1000)}</b>`;
      }
      const n = v.handCounts[seat];
      let backs = '';
      if (pos !== 'bottom') {
        const items = [];
        this.backCount = this.backCount || {};
        let landed = 0;
        for (let i = 0; i < Math.min(n, 8); i++) if (this.arrival(seat, i) === 0) landed++;
        const before = this.dealing() ? this.backCount[seat] || 0 : landed;
        for (let i = 0; i < landed; i++) items.push(i >= before ? '<i class="din"></i>' : '<i></i>');
        this.backCount[seat] = landed;
        backs = `<div class="backs">${items.join('')}</div>`;
      }
      return `<div class="seat ${pos} team${seat % 2} ${isTurn ? 'turn' : ''} ${online ? '' : 'offline'}">
        ${backs}
        ${tab}
        <div class="plate" style="animation-delay:${-(now % 1400)}ms">${this.avatarOf(L.seats[seat], name)}<div class="nm">${esc(name)}${online ? '' : ' <small>(offline)</small>'}</div>${v.dealer === seat ? '<span class="dchip">D</span>' : ''}${bidder}${clock}</div>
        ${big}
        ${tags.length ? `<div class="tags">${tags.map((t) => `<span>${t}</span>`).join('')}</div>` : ''}
      </div>`;
    },
    panelClock() {
      const ck = Client.clock;
      if (!ck || ck.seat !== Client.seat) return '';
      const now = Date.now();
      const left = Math.max(0, ck.end - Math.max(now, ck.start));
      const urgent = left < 5000 && now >= ck.start ? 'urgent' : '';
      return `<div class="pclock ${urgent}"><i style="width:${(left / ck.limit) * 100}%;animation-duration:${left}ms;animation-delay:${Math.max(0, ck.start - now)}ms"></i><b class="cks ${urgent}" style="animation-delay:${-(now % 1000)}ms" data-end="${ck.end}">${Math.ceil(Math.min(left, ck.limit) / 1000)}</b></div>`;
    },
    timerRow(secs) {
      if (!this.host()) return `<div class="small muted trow">Turn timer: ${secs} s</div>`;
      return `<div class="trow"><span class="small">Turn timer</span>${[5, 10, 20].map((t) => `<button class="chip ${t === secs ? 'on' : ''}" data-a="timer" data-t="${t}">${t}s</button>`).join('')}</div>`;
    },
    bidShort(b) {
      if (b === 'pass') return 'PASS';
      if (b === 'double') return '×2';
      if (b === 'redouble') return '×4';
      if (b === 'NT') return 'NO TRUMPS';
      if (b === 'AT') return 'ALL TRUMPS';
      return `<span class="${RED[b] ? 'redt' : ''}">${SYM[b]}</span> ${CT_LABEL[b].toUpperCase()}`;
    },
    /* ---------- cut & deal animation ---------- */
    dealing() { return !!(this.fx && Date.now() < this.fx.t0 + this.fx.dur); },
    handDealing() { return !!(this.fx && Date.now() < this.fx.t0 + this.fx.dur + PACE.hold); },
    // curved fan: x, y (arc) and tilt for each of n cards
    fanLayout(n) {
      const W = Math.min(window.innerWidth, 560);
      const cw = Math.round(Math.min(86, Math.max(56, W * 0.2)));
      const a = n > 1 ? Math.min(3.2, 21 / (n - 1)) : 0; // tilt per card (deg)
      const maxR = (a * (n - 1)) / 2;
      const swing = cw * 1.42 * 1.2 * Math.sin((maxR * Math.PI) / 180) * 0.7; // outer cards lean outwards
      const step = n > 1 ? Math.min(cw * 0.6, (W - 24 - cw - 2 * swing) / (n - 1)) : 0;
      const total = cw + step * (n - 1);
      const x0 = (W - total) / 2;
      const mid = (n - 1) / 2;
      const pts = [];
      for (let i = 0; i < n; i++) { const r = (i - mid) * a; pts.push({ x: x0 + i * step, y: 16 + r * r * 0.12, r }); }
      return { cw, pts };
    },
    fxPacket(seat, idx) { // which packet (0..7) brings card #idx of this seat's hand, or -1
      const f = this.fx;
      if (!f) return -1;
      const i = (seat - f.dealer + 3) % 4; // dealing order: player after dealer first
      if (f.kind === 5) return idx < 3 ? i : idx < 5 ? 4 + i : -1;
      return idx >= 5 && idx < 8 ? i : -1;
    },
    // ms from now until card #idx of `seat` lands (0 when already there)
    arrival(seat, idx) {
      if (!this.dealing()) return 0;
      const j = this.fxPacket(seat, idx);
      if (j < 0) return 0;
      const f = this.fx;
      return Math.max(0, f.pre + j * PACE.step + PACE.fly - (Date.now() - f.t0));
    },
    fxHTML(v) {
      if (!this.dealing()) return '';
      const f = this.fx, el = Date.now() - f.t0;
      const parts = [];
      if (el < f.pre) {
        if (f.kind === 5) parts.push(`<div class="fxdeck cut" style="animation-delay:${-el}ms"><i></i><i></i></div><div class="fxtext">${esc(v.names[f.cutter])} cuts the cards</div>`);
        else parts.push(`<div class="fxdeck"><i></i></div><div class="fxtext big">${this.ctChip(f.contract)} ${CT_LABEL[f.contract.type]} · ${esc(v.names[f.contract.bidder])}</div>`);
      } else {
        const packets = f.kind === 5 ? 8 : 4;
        const lastStart = f.pre + (packets - 1) * PACE.step;
        if (el < lastStart) parts.push('<div class="fxdeck"><i></i></div>');
        for (let j = 0; j < packets; j++) {
          const start = f.pre + j * PACE.step;
          if (start + PACE.fly < el) continue;
          const seat = (f.dealer + 1 + (j % 4)) % 4;
          const pos = ['b', 'r', 't', 'l'][this.rel(seat)];
          parts.push(`<i class="fly to${pos}" style="animation-delay:${start - el}ms;animation-duration:${PACE.fly}ms"></i>`);
        }
      }
      return `<div class="fx">${parts.join('')}</div>`;
    },
    bidLabel(b) {
      if (b === 'pass') return 'Pass';
      if (b === 'double') return '×2 Double';
      if (b === 'redouble') return '×4 Redouble';
      return `<span class="${RED[b] ? 'redt' : ''}">${CT_ICON[b]}</span> ${CT_LABEL[b]}`;
    },
    ctChip(ct) {
      return `<span class="${RED[ct.type] ? 'redt' : ''}">${CT_ICON[ct.type]}</span>${ct.mult > 1 ? ' ×' + ct.mult : ''}`;
    },
    declShort(d, full) {
      if (d.kind === 'carre') return 'Carré' + (full && d.rank ? ' ' + (RLAB[d.rank] || d.rank) : '');
      return ({ 3: 'Tierce', 4: 'Quarte', 5: 'Quint' }[d.len]) + (full && d.suit ? ` ${this.rk(d.top)}${SYM[d.suit]}` : '');
    },
    rk(i) { const r = E.RANKS[i]; return RLAB[r] || r; },
    declLong(d) {
      if (d.kind === 'carre') return `Carré of ${RLAB[d.rank] || d.rank} (${d.pts})`;
      const name = { 3: 'Tierce', 4: 'Quarte', 5: 'Quint' }[d.len];
      return `${name} ${this.rk(d.top - d.len + 1)}–${this.rk(d.top)}${SYM[d.suit]} (${d.pts})`;
    },
    gameHTML(v) {
      const my = Client.seat;
      const us = this.myTeam();
      const ct = v.contract;
      const top = `<div class="topbar">
        <div class="scorecol">
          <button class="score" data-a="history"><div><small>US</small><b>${v.scores[us]}</b></div><div><small>THEM</small><b>${v.scores[1 - us]}</b></div></button>
          <div class="ctbar ${ct ? '' : 'empty'}">${ct ? `<span class="cti ${RED[ct.type] ? 'redt' : ''}">${CT_ICON[ct.type]}</span><span class="ctt"><b>${CT_LABEL[ct.type]}${ct.mult > 1 ? ' ×' + ct.mult : ''}</b><span>${esc(v.names[ct.bidder])}</span></span>` : ''}</div>
        </div>
        <div class="ctinfo"><div class="small muted">Deal ${v.dealNo}</div>${v.hang ? `<div class="small hang">Hanging: ${v.hang}</div>` : ''}</div>
        <div class="tbtns">${v.lastTrick ? '<button class="btn tiny ghost" data-a="last">Last trick</button>' : ''}<button class="btn tiny ghost" data-a="menu">☰</button></div>
      </div>`;
      const seats = [0, 1, 2, 3].map((s) => this.seatHTML(v, s)).join('');
      // trick
      let trick = '';
      const shown = v.trick;
      if (shown.length) {
        const wi = v.phase === 'trickDone' ? E.trickWinnerIndex(shown, ct.type) : -1;
        const wpos = wi >= 0 ? ['b', 'r', 't', 'l'][this.rel(shown[wi].seat)] : '';
        const sweepIn = wpos ? 850 - (Date.now() - (this.tdAt || Date.now())) : 0;
        trick = shown.map((p, i) => {
          const pos = ['b', 'r', 't', 'l'][this.rel(p.seat)];
          const fresh = !this.animKeys.has(p.card);
          const anims = [];
          if (fresh) anims.push(`in${pos} .28s ease-out`);
          if (wpos) anims.push(`col${wpos} .45s ease-in ${sweepIn}ms forwards`);
          return this.card(p.card, `t${pos} ${i === wi ? 'win' : ''}`, anims.length ? `style="animation:${anims.join(',')}"` : '');
        }).join('');
        for (const p of shown) this.animKeys.add(p.card);
      } else this.animKeys.clear();
      let center = '';
      this.centerLow = false;
      const dealing = this.dealing();
      if (dealing) center = '';
      else if (v.phase === 'cut') {
        if (v.cutter === my) center = `<div class="panel">${this.panelClock()}<div class="ptitle">Cut the deck</div><input id="cutr" type="range" min="4" max="28" value="16"><div class="small muted">Cut at card <span id="cutv">16</span></div><button class="btn primary" data-a="cut">Cut</button></div>`;
        else center = `<div class="cutwait"><div class="fxdeck"><i></i></div><div class="fxtext">${esc(v.names[v.cutter])} cuts the cards</div></div>`;
      } else if (v.phase === 'allpass') center = '<div class="status">All passed. Redealing…</div>';
      else if (v.phase === 'bid') {
        if (v.turn === my && v.bidOpts) center = this.bidPanel(v.bidOpts, v), this.centerLow = true;
        else center = `<div class="status">${esc(v.names[v.turn])} is bidding…</div>`;
      }
      // hand
      const sorted = this.sortHand(v.hand, ct && v.phase !== 'bid' && v.phase !== 'cut' ? ct.type : null);
      let hand = sorted;
      if (this.handDealing() && my >= 0) {
        // during the deal: cards land at the end of the row in dealing order; sorting happens after
        const landed = (c) => this.arrival(my, v.hand.indexOf(c)) === 0;
        if (this.fx.kind === 5) hand = v.hand.filter(landed);
        else {
          const first5 = v.hand.slice(0, 5);
          const kept = (this.prevOrder || []).filter((c) => first5.includes(c));
          hand = kept.concat(first5.filter((c) => !kept.includes(c)), v.hand.slice(5).filter(landed));
        }
      }
      this.prevOrder = hand;
      const fan = this.fanLayout(hand.length);
      this.handPos = {};
      hand.forEach((c, i) => { this.handPos[c] = fan.pts[i]; });
      const myTurnPlay = v.phase === 'play' && v.turn === my && v.legal;
      const myTurnPlayOk = myTurnPlay && !dealing;
      const handHTML = hand.map((c, i) => {
        const fp = fan.pts[i];
        const legal = !myTurnPlayOk || v.legal.includes(c);
        return this.card(c, `${myTurnPlayOk && !legal ? 'illegal' : ''} ${this.sel === c ? 'sel' : ''}`, `data-a="card" style="left:${fp.x.toFixed(1)}px;top:${fp.y.toFixed(1)}px;rotate:${fp.r.toFixed(2)}deg"`);
      }).join('');
      let actionBar = '';
      if (myTurnPlayOk) {
        const parts = [];
        const opts = v.declOpts || [];
        if (opts.length) {
          if (this.declIdx >= opts.length) this.declIdx = 0;
          const opt = opts[this.declIdx];
          parts.push('<span class="small">Declare:</span>');
          if (opts.length > 1) parts.push(`<button class="chip alt" data-a="declswap">Option ${this.declIdx + 1}/${opts.length} ⇄</button>`);
          for (const d of opt) parts.push(`<button class="chip ${this.declOff[d.key] ? '' : 'on'}" data-a="decl" data-k="${d.key}">${this.declLong(d)}</button>`);
        }
        if (this.sel && v.beloteCards && v.beloteCards.includes(this.sel)) parts.push(`<button class="chip ${this.beloteOn ? 'on' : ''}" data-a="belote">Belote +20</button>`);
        parts.push(`<span class="hint myturn">${this.sel ? 'Tap again to play' : 'Your turn: tap a card'}</span>`);
        actionBar = `<div class="abar">${parts.join(' ')}</div>`;
      } else if ((v.phase === 'play' || v.phase === 'trickDone') && !dealing) {
        actionBar = `<div class="abar dim"><span class="hint">${v.turn >= 0 ? esc(v.names[v.turn]) + "'s turn" : ''}</span></div>`;
      }
      let overlay = '';
      if ((v.phase === 'dealEnd' || v.phase === 'gameOver') && Date.now() >= (this.sumAt || 0)) overlay = this.summaryHTML(v);
      if (this.overlay === 'last' && v.lastTrick) overlay = this.lastHTML(v);
      if (this.overlay === 'history') overlay = this.historyHTML(v);
      if (this.overlay === 'menu') overlay = this.menuHTML();
      if (this.overlay === 'rules') overlay = this.rulesHTML();
      if (this.overlay === 'chat') overlay = this.chatHTML();
      if (this.overlay === 'leave') overlay = `<div class="overlay"><div class="sheet"><div class="shead">Leave the table?</div><p class="small">${Client.local && !(Client.lobby && Client.lobby.kind === 'practice') ? 'You are the host. The game stops for everyone until you come back with Resume.' : 'You can rejoin with the same link.'}</p><button class="btn danger" data-a="leave">Leave</button><button class="btn ghost" data-a="close">Stay</button></div></div>`;
      return `<div class="game">${top}<div class="felt">${seats}<div class="trick">${trick}</div><div class="center ${this.centerLow ? 'low' : ''}">${center}</div>${this.fxHTML(v)}</div>
        ${actionBar}<div class="hand" id="hand" style="--cw:${fan.cw}px">${handHTML}</div>${my >= 0 ? '<button class="chatbtn" data-a="chat" aria-label="Quick chat">💬</button>' : ''}${overlay}</div>`;
    },
    bidPanel(opts, v) {
      const b = (k, icon, label, cls = '') => `<button class="bidb ${cls}" data-a="bid" data-b="${k}" ${opts.includes(k) ? '' : 'disabled'}><span class="bi ${RED[k] ? 'redt' : ''}">${icon}</span><span>${label}</span></button>`;
      const hist = v && v.bids.length ? `<div class="bhist">${v.bids.slice(-4).map((x) => `${esc(v.names[x.seat])}: ${this.bidLabel(x.bid)}`).join(' · ')}</div>` : '';
      return `<div class="panel bidpanel">${this.panelClock()}${hist}<div class="bidgrid">
        ${b('C', SYM.C, 'Clubs')}${b('NT', 'A', 'No Trumps')}
        ${b('D', SYM.D, 'Diamonds')}${b('AT', 'J', 'All Trumps', 'redj')}
        ${b('H', SYM.H, 'Hearts')}${b('double', '×2', 'Double', 'x')}
        ${b('S', SYM.S, 'Spades')}${b('redouble', '×4', 'Redouble', 'x')}
      </div><button class="btn primary pass" data-a="bid" data-b="pass">PASS</button></div>`;
    },
    summaryHTML(v) {
      const s = v.summary;
      if (!s) return '';
      const us = this.myTeam(), th = 1 - us;
      const col = (arr) => [arr[us], arr[th]];
      const decl = (t) => (s.declDetail[t] || []).map((d) => `<div class="${d.counted ? '' : 'strike'}">${this.declLong(d)}</div>`).join('') || '0';
      const resWord = { outside: 'Made', inside: 'Inside (вътре)', hanging: 'Hanging (висящи)' }[s.result];
      const bidTeamUs = s.contract.team === us;
      const row = (label, a, b, cls = '') => `<tr class="${cls}"><td>${label}</td><td>${a}</td><td>${b}</td></tr>`;
      const ready = v.ready.map((r, i) => (r ? `<span class="rdy">✓ ${esc(v.names[i])}</span>` : '')).join(' ');
      const iAmReady = Client.seat >= 0 && v.ready[Client.seat];
      let foot;
      if (v.phase === 'gameOver' || s.gameOver) {
        const won = s.winner === us;
        foot = `<div class="gover ${won ? 'won' : 'lost'}">${won ? 'You won the game!' : 'They won the game'}</div>
          ${v.phase === 'gameOver' ? (this.host() ? '<button class="btn primary" data-a="newgame">New game</button>' : '<p class="muted small">Waiting for the host to start a new game</p>') : `<button class="btn primary" data-a="ready" ${iAmReady ? 'disabled' : ''}>${iAmReady ? 'Waiting…' : 'Continue'}</button><div class="small">${ready}</div>`}`;
      } else {
        foot = `<button class="btn primary" data-a="ready" ${iAmReady ? 'disabled' : ''}>${iAmReady ? 'Waiting for others…' : 'Next deal'}</button><div class="small">${ready}</div>`;
      }
      const hangNote = [];
      if (s.hangAdd) hangNote.push(`${s.hangAdd} points hang to the next deal`);
      if (s.hangPaid) hangNote.push(`${s.hangPaid} hanging points to ${s.hangTo === us ? 'US' : 'THEM'}`);
      return `<div class="overlay"><div class="sheet">
        <div class="shead">${this.ctChip(s.contract)} ${CT_LABEL[s.contract.type]} <small>(${bidTeamUs ? 'US' : 'THEM'} · ${esc(v.names[s.contract.bidder])})</small></div>
        <table class="sum"><tr class="th"><td></td><td>US</td><td>THEM</td></tr>
        ${row('Belote', ...col(s.belote))}
        <tr><td>Declarations</td><td>${decl(us)}</td><td>${decl(th)}</td></tr>
        ${row('From tricks', ...col(s.trickPts.map((p, i) => `${p} <small>(${s.trickCount[i]})</small>`)))}
        ${s.valatTeam >= 0 ? row('Valat', ...col(s.valat)) : ''}
        ${row('Sum', ...col(s.total), 'b')}
        <tr class="res"><td>Result</td><td colspan="2">${bidTeamUs ? 'US' : 'THEM'}: ${resWord}</td></tr>
        ${row('Points', ...col(s.gained.map((g) => '+' + g)), 'b')}
        ${row('Total', ...col(s.scores), 'tot')}
        </table>
        ${hangNote.length ? `<div class="small hang">${hangNote.join(' · ')}</div>` : ''}
        ${foot}
      </div></div>`;
    },
    lastHTML(v) {
      const lt = v.lastTrick;
      return `<div class="overlay" data-a="close"><div class="sheet"><div class="shead">Last trick · ${esc(v.names[lt.winner])} took it</div>
        <div class="lt">${lt.plays.map((p) => `<div>${this.card(p.card, p.seat === lt.winner ? 'win' : '')}<div class="small">${esc(v.names[p.seat])}</div></div>`).join('')}</div>
        <button class="btn" data-a="close">Close</button></div></div>`;
    },
    historyHTML(v) {
      const us = this.myTeam();
      const rows = v.history.slice().reverse().map((h) => `<tr><td>${h.dealNo}</td><td>${this.ctChip(h.contract)} ${h.contract.team === us ? 'US' : 'THEM'}</td><td>+${h.gained[us]}</td><td>+${h.gained[1 - us]}</td><td>${h.scores[us]} : ${h.scores[1 - us]}</td></tr>`).join('');
      return `<div class="overlay" data-a="close"><div class="sheet"><div class="shead">Score · first to 151</div>
        <table class="sum hist"><tr class="th"><td>#</td><td>Contract</td><td>US</td><td>THEM</td><td>Total</td></tr>${rows || '<tr><td colspan="5">No deals yet</td></tr>'}</table>
        <button class="btn" data-a="close">Close</button></div></div>`;
    },
    menuHTML() {
      const L = Client.lobby;
      return `<div class="overlay" data-a="close"><div class="sheet"><div class="shead">Table ${esc(L.code)}</div>
        <div class="small muted">${L.seats.map((p, i) => `${esc(p ? p.name : '-')} ${p && p.online ? '●' : '○'}`).join(' · ')}</div>
        ${L.kind === 'p2p' ? `<button class="btn" data-a="copy" data-t="${esc(location.href.split('#')[0] + '#' + L.code)}">Copy invite link</button>` : ''}
        ${this.timerRow(L.turnSecs)}
        <button class="btn" data-a="rules">Rules used</button>
        <button class="btn danger" data-a="leaveask">Leave table</button>
        <button class="btn ghost" data-a="close">Close</button></div></div>`;
    },
    rulesHTML() {
      return `<div class="overlay"><div class="sheet rules"><div class="shead">Rules (belot.bg standard)</div>
      <ul>
      <li>32 cards, play counter-clockwise. Deal 3+2, bid, then 3 more. The player before the dealer cuts. Cards are not shuffled between deals.</li>
      <li>Bids: ${SYM.C} &lt; ${SYM.D} &lt; ${SYM.H} &lt; ${SYM.S} &lt; No Trumps &lt; All Trumps. Double (×2) an opponent's bid, Redouble (×4) your own doubled bid. 3 passes end bidding; 4 passes redeal.</li>
      <li>Always follow suit. Trump game: if you cannot follow and an opponent is winning, you must trump; if an opponent already trumped, overtrump if you can, otherwise play anything. If your partner is winning you may play anything. When trumps are led you must play a higher trump if you can.</li>
      <li>All Trumps: follow suit and beat the highest card if you can. No Trumps: just follow suit.</li>
      <li>Declarations (trump and All Trumps only), announced with your first card: Tierce 20, Quarte 50, Quint 100; Carré of J 200, 9 150, A/10/K/Q 100. Only the team with the best sequence scores sequences; equal best sequences cancel. Only the team with the highest carré scores carrés. Belote (K+Q of trump, any suit in All Trumps) 20, announced when the first of the two is played.</li>
      <li>Last trick +10. Valat (all 8 tricks) +90. No Trumps points are doubled.</li>
      <li>Bidders with fewer points are inside: the opponents take everything. Equal points hang to the next deal. Rounding limit: 6 trump game, 5 No Trumps, 4 All Trumps.</li>
      <li>First team to 151 wins. A game cannot end on a valat.</li></ul>
      <button class="btn" data-a="close">Close</button></div></div>`;
    },
    // slide cards from where they were to where they are now; new cards fly in from the deck while dealing
    animateHand(prev) {
      const hand = $('#hand');
      if (!hand || !this.handPos || typeof hand.animate !== 'function') return;
      const felt = $('.felt');
      const hr = hand.getBoundingClientRect();
      const fr = felt ? felt.getBoundingClientRect() : hr;
      const cw = parseFloat(hand.style.getPropertyValue('--cw')) || 70;
      hand.querySelectorAll('.card').forEach((el) => {
        const c = el.dataset.card, to = this.handPos[c], from = prev[c];
        if (!to || typeof el.animate !== 'function') return;
        if (from) {
          if (Math.abs(from.x - to.x) < 0.5 && Math.abs(from.y - to.y) < 0.5 && Math.abs(from.r - to.r) < 0.05) return;
          el.animate([{ translate: `${from.x - to.x}px ${from.y - to.y}px`, rotate: `${from.r}deg` }, { translate: '0px 0px', rotate: `${to.r}deg` }],
            { duration: PACE.slide, easing: 'cubic-bezier(.2,.8,.2,1)' });
        } else if (this.handDealing()) {
          const dx = fr.left + fr.width / 2 - hr.left - cw / 2 - to.x;
          const dy = fr.top + fr.height * 0.46 - hr.top - cw * 0.71 - to.y;
          el.animate([{ translate: `${dx}px ${dy}px`, rotate: '0deg', scale: 0.62, opacity: 0.7 }, { translate: '0px 0px', rotate: `${to.r}deg`, scale: 1, opacity: 1 }],
            { duration: PACE.fly, easing: 'ease-out' });
        }
      });
    },
    layoutHand() {
      const h = $('#hand');
      if (!h) return;
      const cards = h.children.length;
      const W = Math.min(window.innerWidth, 560);
      const cw = Math.min(88, Math.max(58, W * 0.2));
      const step = cards > 1 ? Math.min(cw * 0.72, (W - 16 - cw) / (cards - 1)) : 0;
      h.style.setProperty('--cw', cw + 'px');
      h.style.setProperty('--step', step + 'px');
    },

    /* ---------- events ---------- */
    onClick(e) {
      const el = e.target.closest('[data-a]');
      if (!el) return;
      const a = el.dataset.a;
      const v = Client.view;
      switch (a) {
        case 'create':
          if (!me.name.trim()) { this.toast('Enter your name first'); return $('#name') && $('#name').focus(); }
          store.del('belot-host');
          return App.createTable(null);
        case 'join':
          if (!me.name.trim()) { this.toast('Enter your name first'); return $('#name') && $('#name').focus(); }
          return App.joinTable(this.joinCode || ($('#code') && $('#code').value) || '');
        case 'practice':
          if (!me.name.trim()) { this.toast('Enter your name first'); return $('#name') && $('#name').focus(); }
          store.del('belot-host');
          return App.createTable(null, true);
        case 'addbot': return Client.send({ k: 'addbot', seat: Number(el.dataset.s) });
        case 'rmbot': return Client.send({ k: 'rmbot', seat: Number(el.dataset.s) });
        case 'fillbots': return Client.send({ k: 'fillbots' });
        case 'timer': return Client.send({ k: 'timer', secs: Number(el.dataset.t) });
        case 'resume': {
          if (!me.name.trim()) return this.toast('Enter your name first');
          return App.createTable(store.get('belot-host'));
        }
        case 'sit': return Client.send({ k: 'sit', seat: Number(el.dataset.s) });
        case 'start': return Client.send({ k: 'start' });
        case 'newgame': return Client.send({ k: 'newgame' });
        case 'copy': {
          const t = el.dataset.t;
          const done = () => this.toast('Link copied');
          try { navigator.clipboard.writeText(t).then(done, () => this.toast(t)); } catch (err) { this.toast(t); }
          return;
        }
        case 'leave': return App.leave();
        case 'leaveask':
          this.overlay = 'leave'; return this.render();
        case 'rules': this.overlay = 'rules'; return this.render();
        case 'menu': this.overlay = 'menu'; return this.render();
        case 'avatar': {
          const i = Number(el.dataset.i);
          if (el.disabled) return;
          me.avatar = i; store.set('belot-me', me);
          if (Client.lobby) Client.send({ k: 'avatar', a: i });
          return this.render();
        }
        case 'chat': this.overlay = this.overlay === 'chat' ? null : 'chat'; return this.render();
        case 'react': {
          const now = Date.now();
          this.overlay = null;
          if (this.lastReact && now - this.lastReact < 2000) { this.render(); return this.toast('Wait a moment'); }
          this.lastReact = now;
          Client.send({ k: 'react', i: Number(el.dataset.i) });
          return this.render();
        }
        case 'history': this.overlay = 'history'; return this.render();
        case 'last': this.overlay = 'last'; return this.render();
        case 'close':
          if (e.target.closest('.sheet') && el.classList.contains('overlay')) return; // clicks inside sheet
          this.overlay = null; return this.render();
        case 'cut': { const r = $('#cutr'); return Client.act({ type: 'cut', at: r ? Number(r.value) : 16 }); }
        case 'bid': if (el.disabled) return; return Client.act({ type: 'bid', bid: el.dataset.b });
        case 'ready': return Client.act({ type: 'ready' });
        case 'declswap': this.declIdx++; this.declOff = {}; return this.render();
        case 'decl': { const k = el.dataset.k; this.declOff[k] = !this.declOff[k]; return this.render(); }
        case 'belote': this.beloteOn = !this.beloteOn; return this.render();
        case 'card': {
          const c = el.dataset.card;
          if (!v || v.phase !== 'play' || v.turn !== Client.seat || !v.legal) { if (v && v.phase === 'play') this.toast('Wait for your turn'); return; }
          if (Client.pending || this.dealing()) return;
          if (!v.legal.includes(c)) { this.sel = null; this.render(); return this.toast(this.whyIllegal(c, v)); }
          if (this.sel !== c) { this.sel = c; this.beloteOn = true; return this.render(); }
          const opts = v.declOpts || [];
          const opt = opts[this.declIdx] || [];
          const decls = opt.filter((d) => !this.declOff[d.key]).map((d) => d.key);
          const belote = v.beloteCards && v.beloteCards.includes(c) && this.beloteOn;
          this.sel = null;
          return Client.act({ type: 'play', card: c, decls, belote });
        }
      }
    },
  };

  window.BelotApp = { App, UI, Host, Client };
  App.boot();
})();
</script>
</body>
</html>
